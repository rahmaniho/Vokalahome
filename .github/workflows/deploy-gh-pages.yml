name: Build & Deploy to GitHub Pages

# این یگانه Workflow انتشار سایت است. اگر روزی از GitHub UI پیشنهاد
# «Configure Pages» یا الگوی پیش‌فرض Next.js داده شد، آن را اضافه نکنید:
# دو Workflow هم‌زمان روی همان Pages environment باعث رقابت/انتشار
# تکراری می‌شوند. فقط همین یک فایل کافی است.

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build static export (output: "out")
        run: npm run build
        env:
          NODE_ENV: production

      - name: Add .nojekyll (avoid GitHub Pages ignoring _next/ assets)
        run: touch ./out/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
