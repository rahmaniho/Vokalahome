<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>عدم دسترسی به اینترنت | خانه وکلا</title>
<meta name="theme-color" content="#0B1F3A" />
<style>
  :root{--navy:#0B1F3A;--gold:#C9A227;--paper:#F5F6F8;}
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:var(--navy);color:#fff;font-family:Tahoma,Arial,sans-serif;text-align:center;padding:24px;}
  .box{max-width:420px;}
  .icon{width:76px;height:76px;margin:0 auto 22px;border-radius:22px;background:var(--gold);
    display:flex;align-items:center;justify-content:center;}
  h1{font-size:22px;margin:0 0 10px;}
  p{color:rgba(255,255,255,.7);line-height:2;font-size:14px;margin:0 0 22px;}
  a{display:inline-block;background:var(--gold);color:var(--navy);font-weight:bold;
    padding:12px 26px;border-radius:12px;text-decoration:none;font-size:14px;}
  .tel{display:block;margin-top:16px;color:#fff;font-size:13px;direction:ltr;}
</style>
</head>
<body>
  <div class="box">
    <div class="icon">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#0B1F3A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 9a15 15 0 0 1 22 0M5 13a10 10 0 0 1 14 0M9 17a5 5 0 0 1 6 0" />
        <line x1="2" y1="2" x2="22" y2="22" />
      </svg>
    </div>
    <h1>در حال حاضر آفلاین هستید</h1>
    <p>به‌نظر می‌رسد اتصال اینترنت برقرار نیست. صفحاتی که پیش‌تر باز کرده‌اید ممکن است از حافظهٔ محلی در دسترس باشند؛ برای تماس فوری با خانه وکلا می‌توانید مستقیماً تماس بگیرید.</p>
    <a href="./">تلاش دوباره</a>
    <span class="tel">۰۲۸-۳۳۲۲۲۲۲۲</span>
  </div>
</body>
</html>
